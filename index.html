<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecuRoutine Mobile Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- AUTH SCREEN -->
  <div id="authScreen" class="screen auth-screen">
    <div class="phone-frame">
      <div class="auth-card">
        <h1 class="logo">SECUROUTINE</h1>
        <p class="subtitle">Security habit tracker</p>

        <div class="tabs">
          <button id="loginTab" class="tab active" type="button">Login</button>
          <button id="registerTab" class="tab" type="button">Register</button>
        </div>

        <div id="loginForm">
          <input id="loginEmail" type="email" placeholder="Email" value="demo@securoutine.com" />
          <input id="loginPassword" type="password" placeholder="Password" value="123456" />
          <button class="primary" type="button" onclick="login()">Login</button>
        </div>

        <div id="registerForm" class="hidden">
          <input id="registerName" type="text" placeholder="Display name" />
          <input id="registerEmail" type="email" placeholder="Email" />
          <input id="registerPassword" type="password" placeholder="Password" />
          <button class="primary" type="button" onclick="register()">Create Account</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PROFILE SETUP SCREEN -->
  <div id="profileScreen" class="screen hidden">
    <div class="phone-frame">
      <div class="auth-card">
        <h1 class="logo">SECUROUTINE</h1>
        <p class="subtitle">Profile Setup</p>

        <input id="profileDisplayName" type="text" placeholder="Display name" />
        
        <select id="profileExperience">
          <option value="">Select experience level</option>
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>

        <select id="profileAgeGroup">
          <option value="">Select age group</option>
          <option value="Younger User">Younger User</option>
          <option value="Adult User">Adult User</option>
          <option value="Older User">Older User</option>
        </select>

        <select id="profilePreference">
          <option value="">Select main security preference</option>
          <option value="Login Safety">Login Safety</option>
          <option value="Privacy Review">Privacy Review</option>
          <option value="Password Hygiene">Password Hygiene</option>
        </select>

        <button class="primary" type="button" onclick="saveProfile()">Save Profile and Generate Tasks</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="screen hidden">
    <div class="phone-frame dashboard-frame">
      <div class="app-card">
        <h1 class="logo">SECUROUTINE</h1>

        <h2 class="welcome">
          Welcome back,<br />
          <span id="userName">User</span>
        </h2>

        <div class="icon-row">
          <div class="icon-box">🔔</div>
          <div class="icon-box">📋</div>
          <div class="icon-box">⚙️</div>
        </div>

        <div class="streak-label">STREAK:</div>
        <div class="streak-number" id="streakValue">1</div>

        <div class="mini-stats">
          <div class="mini-card">
            <span>Points</span>
            <strong id="pointsValue">0</strong>
          </div>
          <div class="mini-card">
            <span>Level</span>
            <strong id="levelValue">1</strong>
          </div>
          <div class="mini-card">
            <span>Done</span>
            <strong id="completedValue">0</strong>
          </div>
        </div>

        <div class="task-section">
          <div class="section-header">
            <h3>Today’s Tasks</h3>
            <button class="text-btn" type="button" onclick="generateNewTaskSet()">New Set</button>
          </div>
          <div id="taskList"></div>
        </div>
      </div>

      <div class="bottom-nav">
        <button type="button" class="nav-btn active">🏠</button>
        <button type="button" class="nav-btn">🔔</button>
        <button type="button" class="nav-btn">📋</button>
        <button type="button" class="nav-btn" onclick="logout()">⚙️</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
